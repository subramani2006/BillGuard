tariff_code: "TN_DOMESTIC_LT1A_2024"
tariff_name: "TANGEDCO Low Tension Tariff I-A (Domestic) - July 2024 Revision"
tariff_category: "LT-1A Domestic"
state: "Tamil Nadu"
authority: "Tamil Nadu Electricity Regulatory Commission (TNERC)"
