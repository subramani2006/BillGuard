tariff_code: "TN_DOMESTIC_LT1A_2022"
tariff_name: "TANGEDCO Low Tension Tariff I-A (Domestic) - Sept 2022 Revision"
tariff_category: "LT-1A Domestic"
state: "Tamil Nadu"
authority: "Tamil Nadu Electricity Regulatory Commission (TNERC)"
order_reference: "TNERC Tariff Order No. 7 of 2022, Effective 10-Sep-2022"
effective_start_date: "2022-09-10"
effective_end_date: "2023-06-30"
verification_status: "VERIFIED_OFFICIAL"
billing_cycle_days: 60
billing_cycle_type: "bi-monthly"
free_allowance_units: 100
free_allowance_description: "First 100 units free for all domestic consumers subsidized by GoTN"
subsidy_conditions: "First 100 units free per bi-monthly cycle for domestic consumers under GoTN subsidy (G.O. Ms. No. 38, Energy Department). Applicable to single domestic service connection per premises."
calculation_methodology: "TNERC multi-tier progressive telescopic slab structure: 0-100 units (100% GoTN subsidy, ₹0 net), 101-200 units (50% GoTN subsidy, ₹2.25 net), 201-400 (₹4.50 net), 401-500 (₹6.00 net), 501-600 (₹8.00 net), 601-800 (₹9.00 net), 801-1000 (₹10.00 net), above 1000 (₹11.00 net). Fixed monthly charges abolished."
disclaimer: "Official statutory tariff verified against TNERC and TANGEDCO/TNPDCL orders."

slabs:
  - min_units: 0
    max_units: 100
    rate_per_unit: 4.50
    subsidy_per_unit: 4.50
    net_rate: 0.00
    description: "0 to 100 units (100% GoTN Subsidy)"
  - min_units: 101
    max_units: 200
    rate_per_unit: 4.50
    subsidy_per_unit: 2.25
    net_rate: 2.25
    description: "101 to 200 units (Partial GoTN Subsidy)"
  - min_units: 201
    max_units: 400
    rate_per_unit: 4.50
    subsidy_per_unit: 0.00
    net_rate: 4.50
    description: "201 to 400 units"
  - min_units: 401
    max_units: 500
    rate_per_unit: 6.00
    subsidy_per_unit: 0.00
    net_rate: 6.00
    description: "401 to 500 units"
  - min_units: 501
    max_units: 600
    rate_per_unit: 8.00
    subsidy_per_unit: 0.00
    net_rate: 8.00
    description: "501 to 600 units"
  - min_units: 601
    max_units: 800
    rate_per_unit: 9.00
    subsidy_per_unit: 0.00
    net_rate: 9.00
    description: "601 to 800 units"
  - min_units: 801
    max_units: 1000
    rate_per_unit: 10.00
    subsidy_per_unit: 0.00
    net_rate: 10.00
    description: "801 to 1000 units"
  - min_units: 1001
    max_units: null
    rate_per_unit: 11.00
    subsidy_per_unit: 0.00
    net_rate: 11.00
    description: "Above 1000 units"

fixed_charges:
  enabled: false
  amount_per_cycle: 0.00
  notes: "Domestic LT-1A fixed monthly charges abolished in 2022 tariff order"

electricity_tax:
  enabled: false
  rate_percentage: 5.0
  threshold_units: 1000
  notes: "Domestic low-tension consumption generally exempt or applied above 1000 units"

fppca:
  enabled: true
  rate_per_unit: 0.25
  description: "Fuel and Power Purchase Cost Adjustment per billable unit"
