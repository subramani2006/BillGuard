tariff_code: "TN_DOMESTIC_LT1A_2023"
tariff_name: "TANGEDCO Low Tension Tariff I-A (Domestic) - July 2023 Revision"
tariff_category: "LT-1A Domestic"
state: "Tamil Nadu"
authority: "Tamil Nadu Electricity Regulatory Commission (TNERC)"
order_reference: "TNERC Annual Tariff Revision Order, Effective 01-Jul-2023"
effective_start_date: "2023-07-01"
effective_end_date: "2024-06-30"
verification_status: "VERIFIED_OFFICIAL"
billing_cycle_days: 60
billing_cycle_type: "bi-monthly"
free_allowance_units: 100
free_allowance_description: "First 100 units free for all domestic consumers subsidized by GoTN"
subsidy_conditions: "First 100 units free per bi-monthly cycle for domestic consumers under GoTN subsidy (G.O. Ms. No. 38, Energy Department). Applicable to single domestic service connection per premises."
calculation_methodology: "TNERC multi-tier progressive telescopic slab structure: 0-100 units (100% GoTN subsidy, ₹0 net), 101-200 units (50% GoTN subsidy, ₹2.35 net), 201-400 (₹4.70 net), 401-500 (₹6.30 net), 501-600 (₹8.40 net), 601-800 (₹9.45 net), 801-1000 (₹10.50 net), above 1000 (₹11.55 net). FPPCA of ₹0.29/kWh."
disclaimer: "Official statutory tariff verified against TNERC and TANGEDCO/TNPDCL orders."

